# Linux on every push and pull request; Windows and macOS only where it matters (PRs to
# main/staging, pushes to main, release tags, manual runs) to keep private-repo minutes low.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".gitignore", ".env.example"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitignore", ".env.example"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Jobs to run besides Linux"
        type: choice
        default: all
        options: [all, windows, macos, none]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Smaller, faster CI builds (the release profile keeps line tables for local profiling).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  RUST_BACKTRACE: "1"
  # Tests never reach a model provider (scripted provider only); make sure no key leaks in.
  OPENROUTER_API_KEY: ""
  OPENAI_API_KEY: ""

jobs:
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --release --locked

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Default features only (the action defaults to --all-features, which pulls
          # in the optional LGPL `mp3` encoder).
          arguments: --locked

  windows:
    name: Windows (clippy, test)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'staging'))
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --release --locked --no-fail-fast

  macos:
    name: macOS (clippy, test; x86_64 check)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'macos')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'staging'))
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check the Intel build
        run: cargo check --workspace --locked --target x86_64-apple-darwin
      - run: cargo test --workspace --release --locked --no-fail-fast
