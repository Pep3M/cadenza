[package]
name = "cadenza-app"
description = "Cadenza desktop application (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# egui 0.36 needs a newer compiler than the rest of the workspace.
rust-version = "1.95"

[features]
# Time-stretch / pitch-shift in the audio editor (Signalsmith; C++ compiler + libclang).
stretch = ["cadenza-audio-io/stretch", "cadenza-engine/stretch"]

[[bin]]
name = "cadenza-app"
path = "src/main.rs"

[dependencies]
cadenza-core.workspace = true
cadenza-model.workspace = true
cadenza-dsp.workspace = true
cadenza-engine.workspace = true
cadenza-mcp.workspace = true
cadenza-plugin-host.workspace = true
cadenza-audio-io.workspace = true
cadenza-midi-io.workspace = true
cadenza-theory.workspace = true
cadenza-agent.workspace = true
cadenza-library.workspace = true
cadenza-analysis.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
keyring.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
tempfile.workspace = true
skrifa.workspace = true
hound.workspace = true
