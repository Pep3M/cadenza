[package]
name = "cadenza-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Offline time-stretch / pitch-shift tools (needs a C++ compiler + libclang).
stretch = ["cadenza-audio-io/stretch", "cadenza-engine/stretch"]

[dependencies]
cadenza-core.workspace = true
cadenza-model.workspace = true
cadenza-theory.workspace = true
cadenza-dsp.workspace = true
cadenza-engine.workspace = true
cadenza-plugin-host.workspace = true
cadenza-audio-io.workspace = true
cadenza-midi-io.workspace = true
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rmcp = { version = "3.5", features = ["client"] }
hound.workspace = true
tempfile.workspace = true
