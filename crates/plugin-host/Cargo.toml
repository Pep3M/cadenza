[package]
name = "cadenza-plugin-host"
description = "Third-party plugin hosting for Cadenza: discovery, out-of-process scanning, catalog and real-time CLAP and VST3 instances"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cadenza-dsp.workspace = true
clack-host.workspace = true
clack-extensions = { workspace = true, features = ["clack-host", "audio-ports", "note-ports", "params", "state", "latency", "tail", "log", "thread-check", "preset-discovery", "gui", "timer", "posix-fd"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
base64.workspace = true
vst3.workspace = true
libloading.workspace = true
libc.workspace = true
rtrb.workspace = true

# Plugin editor windows (X11, through XWayland on Wayland desktops).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb.workspace = true

[dev-dependencies]
tempfile.workspace = true
