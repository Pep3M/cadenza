<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0e0f11;-webkit-font-smoothing:antialiased}a{color:#e8e9ec;text-decoration:none}a:hover{color:#7fb4ff}</style>
</helmet>
<div style="font-family:'IBM Plex Sans',sans-serif;color:#e8e9ec;padding:56px 40px;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:700;letter-spacing:.14em;color:#4c9cf5;font-size:13px">CADENZA</span><span style="font-size:36px;font-weight:600;letter-spacing:-0.015em">UI redesign · Graphite</span><span style="font-size:15px;color:#a3a6ad;line-height:1.6">Every screen is 1920 × 1080 unless noted, with UX notes beside it.</span></div>
<div style="display:flex;flex-direction:column;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px #24262b">
<sc-for list="{{ pages }}" as="p" hint-placeholder-count="15"><a href="{{ p.href }}" style="display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;background:#15161a;border-bottom:1px solid #1d1f23" style-hover="background:#1c1d21"><span style="font-family:'IBM Plex Mono',monospace;color:#80848c">{{ p.n }}</span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:14px">{{ p.t }}</span><span style="color:#a3a6ad;font-size:12.5px">{{ p.d }}</span></span><span style="color:#80848c">→</span></a></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['1', 'Cadenza Directions.dc.html', 'Design directions', 'Graphite (chosen), Ember, Signal'],
      ['2', 'Cadenza Graphite System.dc.html', 'Design system', 'Tokens, states, :root and Rust constants'],
      ['01', '01 Main Window.dc.html', 'Main window', 'Transport, browser, arrange, inspector, mixer'],
      ['02', '02 Arrange Close-up.dc.html', 'Arrange close-up', 'Folder, freeze, automation, takes, fades, tempo lane'],
      ['03', '03 Mixer.dc.html', 'Mixer', 'Strips, buses, VCA, master, routing'],
      ['04', '04 Piano Roll.dc.html', 'Piano roll', 'Tools, scale rows, ghosts, velocity and CC lanes'],
      ['05', '05 AI Producer.dc.html', 'AI producer', 'Mid-request, after, settings'],
      ['06', '06 Mix Assistant.dc.html', 'Mix assistant', 'Report and before → after'],
      ['07', '07 Drum Sampler and Sampler.dc.html', 'Drum sampler and sampler', 'Pads, kit, zone map'],
      ['08', '08 Style Library.dc.html', 'Style library', 'Filters, cards, style document'],
      ['09', '09 Start and Empty Project.dc.html', 'Start screen and empty project', 'First run'],
      ['10', '10 Export.dc.html', 'Export', 'Dialog, progress, result'],
      ['11', '11 Recording.dc.html', 'Recording', 'Count-in, loop recording'],
      ['12', '12 Responsive Layout.dc.html', 'Responsive layout', '1366 × 768, 2560 × 1440, panel rules, HiDPI'],
      ['13', '13 Icons.dc.html', 'Icons', 'Lucide with Phosphor alternatives'],
      ['14', '14 Device Kit.dc.html', 'Device kit', 'Knobs, readouts, toggles, ADSR, frequency display, meters, palette, header'],
      ['15', '15 EQ and Compressor.dc.html', 'EQ and compressor', 'Live EQ (dock + compact), compressor, AI change, floating window'],
      ['16', '16 Effects.dc.html', 'Effects', 'Limiter, reverb, delay, chorus, saturator, gain'],
      ['17', '17 Instruments.dc.html', 'Instruments', 'Poly Synth, Electric Piano, Drum Machine, Drum Sampler, Sampler'],
      ['18', '18 Interaction Spec.dc.html', 'Interaction spec', 'Per-device interactions, responsive collapse order, drawing budget, ideas'],
    ];
    return { pages: P.map(([n, f, t, d]) => ({ n, href: encodeURI('./' + f), t, d })) };
  }
}
</script>
</body>
</html>
