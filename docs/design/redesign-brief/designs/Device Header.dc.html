<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'IBM Plex Sans',sans-serif;color:#e8e9ec;font-size:12px;background:#15161a;border-bottom:1px solid #24262b;display:flex;flex-direction:column">
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<div style="height:36px;display:flex;align-items:center;gap:8px;padding:0 10px 0 8px">
<span title="Power / bypass" style="width:24px;height:24px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;background:{{ pwBg }};box-shadow:inset 0 0 0 1px {{ pwBd }}"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M4.2 3.6 A4.6 4.6 0 1 0 9.8 3.6" stroke="{{ pwFg }}" stroke-width="1.6" fill="none" stroke-linecap="round"></path><line x1="7" y1="1.6" x2="7" y2="6.4" stroke="{{ pwFg }}" stroke-width="1.6" stroke-linecap="round"></line></svg></span>
<span style="font-weight:600;font-size:13px;white-space:nowrap">{{ name }}</span>
<span style="height:20px;display:flex;align-items:center;gap:6px;padding:0 7px;background:#1c1d21;border-radius:3px;color:#a3a6ad;white-space:nowrap"><span style="width:8px;height:8px;border-radius:2px;background:{{ tc }}"></span>{{ track }}</span>
<span style="width:1px;height:18px;background:#24262b;margin:0 4px"></span>
<div style="display:flex;align-items:center;gap:2px">
<span style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:#212328;border-radius:4px 0 0 4px;color:#a3a6ad">‹</span>
<span style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:#212328;border-radius:0;color:#a3a6ad">›</span>
<span style="height:22px;min-width:{{ presetW }}px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#0e0f11;border:1px solid #24262b;border-radius:0 4px 4px 0;box-sizing:border-box;white-space:nowrap"><span style="color:#80848c;font-size:11px">Preset</span><span style="font-weight:500">{{ preset }}</span><span style="color:#f2a944;display:{{ dirtyD }}">●</span><span style="flex:1"></span><span style="color:#80848c">▾</span></span>
</div>
<span style="height:22px;display:{{ wideD }};align-items:center;padding:0 8px;background:#212328;border-radius:4px;color:#a3a6ad">Save</span>
<div style="display:flex;align-items:center;gap:0;background:#0e0f11;border-radius:4px;padding:2px;box-shadow:inset 0 0 0 1px #24262b">
<span style="height:18px;width:22px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:600;font-size:11px;background:{{ aBg }};color:{{ aFg }}">A</span>
<span style="height:18px;width:22px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:600;font-size:11px;background:{{ bBg }};color:{{ bFg }}">B</span>
</div>
<span style="color:#80848c;font-size:11px;white-space:nowrap;display:{{ wideD }}">A→B</span>
<span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#80848c;white-space:nowrap;padding-left:6px">{{ undo }}</span>
<div style="flex:1"></div>
<span style="display:{{ extraD }};height:22px;align-items:center;gap:6px;padding:0 8px;background:#1c1d21;border-radius:4px;white-space:nowrap;box-shadow:inset 0 0 0 1px #2a2c32"><span style="color:#80848c;font-size:11px">{{ extraLabel }}</span><span style="width:8px;height:8px;border-radius:2px;background:{{ extraColor }}"></span><span style="font-weight:500">{{ extra }}</span><span style="color:#80848c">▾</span></span>
<div style="display:flex;align-items:center;gap:6px;padding:0 4px">
<span style="font-size:10.5px;color:#80848c;font-weight:500">IN</span>
<div style="display:flex;flex-direction:column;gap:2px;width:64px"><div style="height:3px;border-radius:1px;background:linear-gradient(90deg,#4fc38a 0 72%,#e8c94a 72% 90%,#f0524f 90%);position:relative;overflow:hidden"><div style="position:absolute;top:0;bottom:0;right:0;left:{{ inP }}%;background:#0e0f11"></div></div><div style="height:3px;border-radius:1px;background:linear-gradient(90deg,#4fc38a 0 72%,#e8c94a 72% 90%,#f0524f 90%);position:relative;overflow:hidden"><div style="position:absolute;top:0;bottom:0;right:0;left:{{ inP2 }}%;background:#0e0f11"></div></div></div>
<span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#a3a6ad;width:34px">{{ inTxt }}</span>
<span style="font-size:10.5px;color:#80848c;font-weight:500">OUT</span>
<div style="display:flex;flex-direction:column;gap:2px;width:64px"><div style="height:3px;border-radius:1px;background:linear-gradient(90deg,#4fc38a 0 72%,#e8c94a 72% 90%,#f0524f 90%);position:relative;overflow:hidden"><div style="position:absolute;top:0;bottom:0;right:0;left:{{ outP }}%;background:#0e0f11"></div></div><div style="height:3px;border-radius:1px;background:linear-gradient(90deg,#4fc38a 0 72%,#e8c94a 72% 90%,#f0524f 90%);position:relative;overflow:hidden"><div style="position:absolute;top:0;bottom:0;right:0;left:{{ outP2 }}%;background:#0e0f11"></div></div></div>
<span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#a3a6ad;width:34px">{{ outTxt }}</span>
</div>
<div style="display:{{ mixD }};align-items:center;gap:6px;padding:0 6px;height:22px;background:#0e0f11;border:1px solid #24262b;border-radius:3px;box-sizing:border-box">
<span style="font-size:11px;color:#a3a6ad">Mix</span><div style="width:56px;height:4px;background:#212328;border-radius:2px;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:{{ mixP }}%;background:#c4c7cd;border-radius:2px"></div></div><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;width:36px;text-align:right">{{ mix }}</span>
</div>
<span style="height:24px;display:flex;align-items:center;gap:7px;padding:0 10px;background:{{ aiBg }};border-radius:4px;color:#7fb4ff;font-weight:500;box-shadow:inset 0 0 0 1px #2c4a73;white-space:nowrap"><span style="width:6px;height:6px;background:#4c9cf5;transform:rotate(45deg)"></span>{{ aiTxt }}</span>
<span style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#a3a6ad;border-radius:4px" title="Pop out"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1.5" y="4" width="8.5" height="8.5" rx="1.5" fill="none" stroke="#a3a6ad" stroke-width="1.3"></rect><path d="M6 1.5 H12.5 V8" fill="none" stroke="#a3a6ad" stroke-width="1.3"></path></svg></span>
<span style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#a3a6ad;font-size:15px">×</span>
</div>
</sc-if>
<sc-if value="{{ compact }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px">
<div style="display:flex;align-items:center;gap:7px">
<span style="width:22px;height:22px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;background:{{ pwBg }};box-shadow:inset 0 0 0 1px {{ pwBd }}"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M4.2 3.6 A4.6 4.6 0 1 0 9.8 3.6" stroke="{{ pwFg }}" stroke-width="1.6" fill="none" stroke-linecap="round"></path><line x1="7" y1="1.6" x2="7" y2="6.4" stroke="{{ pwFg }}" stroke-width="1.6" stroke-linecap="round"></line></svg></span>
<span style="font-weight:600;font-size:13px;white-space:nowrap">{{ name }}</span>
<span style="display:flex;align-items:center;gap:5px;color:#a3a6ad;white-space:nowrap;font-size:11px"><span style="width:7px;height:7px;border-radius:2px;background:{{ tc }}"></span>{{ track }}</span>
<div style="flex:1"></div>
<span style="height:22px;display:flex;align-items:center;gap:6px;padding:0 8px;background:{{ aiBg }};border-radius:4px;color:#7fb4ff;font-weight:500;box-shadow:inset 0 0 0 1px #2c4a73;font-size:11.5px"><span style="width:5px;height:5px;background:#4c9cf5;transform:rotate(45deg)"></span>AI</span>
<span style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#a3a6ad">⋯</span>
</div>
<div style="display:flex;align-items:center;gap:4px">
<span style="width:20px;height:22px;display:flex;align-items:center;justify-content:center;background:#212328;border-radius:4px 0 0 4px;color:#a3a6ad">‹</span>
<span style="width:20px;height:22px;display:flex;align-items:center;justify-content:center;background:#212328;color:#a3a6ad;margin-left:-2px">›</span>
<span style="flex:1;min-width:0;height:22px;display:flex;align-items:center;gap:5px;padding:0 7px;background:#0e0f11;border:1px solid #24262b;border-radius:0 4px 4px 0;box-sizing:border-box;margin-left:-2px;white-space:nowrap;overflow:hidden"><span style="font-weight:500;overflow:hidden;text-overflow:ellipsis">{{ preset }}</span><span style="color:#f2a944;display:{{ dirtyD }}">●</span><span style="flex:1"></span><span style="color:#80848c">▾</span></span>
<div style="display:flex;background:#0e0f11;border-radius:4px;padding:2px;box-shadow:inset 0 0 0 1px #24262b"><span style="height:18px;width:20px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:600;font-size:11px;background:{{ aBg }};color:{{ aFg }}">A</span><span style="height:18px;width:20px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:600;font-size:11px;background:{{ bBg }};color:{{ bFg }}">B</span></div>
<div style="display:flex;flex-direction:column;gap:2px;width:34px;padding-left:4px"><div style="height:3px;border-radius:1px;background:linear-gradient(90deg,#4fc38a 0 72%,#e8c94a 72% 90%,#f0524f 90%);position:relative;overflow:hidden"><div style="position:absolute;top:0;bottom:0;right:0;left:{{ inP }}%;background:#0e0f11"></div></div><div style="height:3px;border-radius:1px;background:linear-gradient(90deg,#4fc38a 0 72%,#e8c94a 72% 90%,#f0524f 90%);position:relative;overflow:hidden"><div style="position:absolute;top:0;bottom:0;right:0;left:{{ outP }}%;background:#0e0f11"></div></div></div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:40},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Parametric EQ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;track&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vocals&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tc&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e07fb0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;preset&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vocal · air and body&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dirty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;power&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mixV&quot;:{&quot;editor&quot;:null,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;inDb&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:-14,&quot;tsType&quot;:&quot;number&quot;},&quot;outDb&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:-12,&quot;tsType&quot;:&quot;number&quot;},&quot;extra&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;extraLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sidechain&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;extraColor&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#e8705f&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ai&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;busy&quot;,&quot;changed&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;undo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;⌘Z undo&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, on = p.power !== false;
    const pct = d => Math.max(0, Math.min(100, (Number(d) + 60) / 60 * 100));
    const inDb = p.inDb ?? -14, outDb = p.outDb ?? -12, ab = p.ab || 'A';
    const ai = p.ai || '';
    return {
      wide: !p.compact, compact: !!p.compact, wideD: p.narrow ? 'none' : 'inline', presetW: p.narrow ? 120 : 200,
      name: p.title || 'Parametric EQ', track: p.track || 'Vocals', tc: p.tc || '#e07fb0',
      preset: p.preset || 'Default', dirtyD: p.dirty ? 'inline' : 'none',
      undo: p.undo ?? '⌘Z undo',
      pwBg: on ? '#1d3a2b' : '#212328', pwBd: on ? '#2d5a40' : '#2a2c32', pwFg: on ? '#4fc38a' : '#7a7e86',
      aBg: ab === 'A' ? '#363940' : 'transparent', aFg: ab === 'A' ? '#e8e9ec' : '#80848c',
      bBg: ab === 'B' ? '#363940' : 'transparent', bFg: ab === 'B' ? '#e8e9ec' : '#80848c',
      inP: pct(inDb), inP2: pct(inDb - 1.2), outP: pct(outDb), outP2: pct(outDb - 0.8),
      inTxt: Number(inDb).toFixed(1).replace('-', '−'), outTxt: Number(outDb).toFixed(1).replace('-', '−'),
      mixD: p.mix ? 'flex' : 'none', mix: p.mix || '', mixP: p.mixV != null ? p.mixV * 100 : 100,
      extraD: p.extra ? 'flex' : 'none', extra: p.extra || '', extraLabel: p.extraLabel || 'Sidechain', extraColor: p.extraColor || '#e8705f',
      aiBg: ai ? '#24395a' : '#1d2a3d', aiTxt: ai === 'busy' ? 'AI is tuning…' : 'Ask AI',
    };
  }
}
</script>
</body>
</html>
